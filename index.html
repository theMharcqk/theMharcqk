<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaClips — vertical AI clipping</title>
    <meta name="description" content="Prompt-intelligent vertical video clipping. Upload, say what you want, export." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <strong>MaClips</strong>
            <p>Vertical clips, in one prompt</p>
          </div>
        </div>
        <button id="export-btn" class="btn primary" type="button" disabled>Export</button>
      </header>

      <section id="dropzone" class="dropzone">
        <input id="file-input" type="file" accept="video/*" hidden />
        <div class="drop-card">
          <p class="kicker">Personal clipping studio</p>
          <h1>Drop a vertical video.<br />Tell it what to keep.</h1>
          <p class="lede">Clips stay on your device. AI only reads timestamps and your prompt.</p>
          <button id="pick-btn" class="btn primary" type="button">Upload video</button>
          <p class="hint">MP4, MOV, or WebM · 9:16 preferred · processed locally</p>
        </div>
      </section>

      <main id="studio" class="studio" hidden>
        <section class="board">
          <form id="prompt-form" class="prompt">
            <label for="prompt-input">What should we clip?</label>
            <div class="prompt-row">
              <input
                id="prompt-input"
                name="prompt"
                autocomplete="off"
                placeholder="15s hook from the start, cut silence, 3 best moments…"
              />
              <button class="btn primary" type="submit">Clip</button>
            </div>
            <div id="chips" class="chips"></div>
          </form>
        </section>

        <div class="studio-body">
          <aside class="stage">
            <div class="phone">
              <video id="player" playsinline preload="auto"></video>
              <div class="phone-ui">
                <span id="clock">0:00</span>
                <button id="play-btn" type="button" aria-label="Play">Play</button>
              </div>
            </div>
            <input id="scrub" type="range" min="0" max="0" step="0.01" value="0" />
          </aside>

          <section class="results">
            <p id="status" class="status" role="status"></p>

            <div class="trim" hidden id="trim-wrap">
              <label>In <input id="in-time" type="number" min="0" step="0.1" /></label>
              <label>Out <input id="out-time" type="number" min="0" step="0.1" /></label>
            </div>

            <ol id="clips" class="clips"></ol>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
